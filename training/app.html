<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f5f8f6;color:#102018}.top{background:#0f6b43;color:#fff;padding:20px}.in{max-width:760px;margin:auto}h1{font-size:36px;margin:0 0 5px}.wrap{max-width:760px;margin:auto;padding:15px}.intro,.ex{background:#fff;border:1px solid #dfe7e2;border-radius:15px;padding:16px;margin-bottom:12px}.meta{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eaf7ef;color:#176b43;border-radius:99px;padding:6px 9px;font-weight:800;font-size:13px}.ex h2{margin:0 0 8px;font-size:21px}.n{display:inline-flex;background:#0f6b43;color:#fff;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;margin-right:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#f6f8f7;border-radius:9px;padding:10px}.cue{margin-top:9px;border-left:4px solid #1d8f5a;padding:9px 11px;background:#f0f8f3}.back{color:#0f6b43;font-weight:800;text-decoration:none}@media(max-width:500px){.row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="in"><h1 id="title">TRAINING</h1><div id="sub"></div></div></header><main class="wrap"><section class="intro"><div class="meta"><span class="tag" id="time"></span><span class="tag">2 Durchgänge</span></div><p><b>Ablauf:</b> Übungen 1–6 der Reihe nach. Nach Übung 6: 60 Sek. Pause, dann Runde 2.</p></section><div id="list"></div><p><a class="back" href="../">← Zur Trainingsbibliothek</a></p></main><script>const D={
'ruecken-fit':['RÜCKEN FIT','Rücken • Haltung • Stabilität','12–15 Min.',[['Cat-Cow','10–12 Wdh.','15 Sek.','Wirbelsäule langsam rund und lang bewegen.'],['Bird Dog','10–12 je Seite','15 Sek.','Vierfüßlerstand, gegenüberliegenden Arm und Bein strecken.'],['Superman Lift','10–12 Wdh.','20 Sek.','Bauchlage, Brust und Arme nur leicht anheben.'],['Glute Bridge','12–15 Wdh.','15 Sek.','Gesäß aktiv, Becken kontrolliert heben.'],['Reverse Snow Angel','10–12 Wdh.','20 Sek.','Arme in Bauchlage kontrolliert seitlich führen.'],['Child’s Pose','30–40 Sek.','20 Sek.','Rücken lang machen und ruhig atmen.']]],
'knie-beinachse':['KNIE & BEINACHSE','Stabilität • Kontrolle • Prävention','15 Min.',[['Kniebeuge','12–15 Wdh.','20 Sek.','Knie folgen der Fußrichtung, Gewicht gleichmäßig verteilen.'],['Ausfallschritt rückwärts','8–10 je Seite','20 Sek.','Vorderes Knie stabil über dem Fuß halten.'],['Step-down','8–10 je Seite','20 Sek.','Becken waagrecht, Knie kontrolliert führen.'],['Einbeinstand','30 Sek. je Seite','15 Sek.','Standbein leicht gebeugt, Fußgewölbe aktiv.'],['Seitliches Bandgehen','10–12 Schritte je Seite','20 Sek.','Knie leicht gebeugt, Becken stabil.'],['Einbeinige Kniebeuge zur Box','8–10 je Bein','25 Sek.','START: auf einem Bein vor der Box. END: kontrolliert zur Box absenken. Knie bleibt über dem Fuß.']]],
'sprunggelenk-fuss':['SPRUNGGELENK & FUSS','Balance • Stabilität • Fußkraft','12–15 Min.',[['Fußgewölbe aktivieren','12–15 Wdh.','15 Sek.','Großzehenballen, Kleinzehenballen und Ferse belasten.'],['Wadenheben','15–20 Wdh.','20 Sek.','Langsam hochdrücken und kontrolliert absenken.'],['Einbeinstand','30 Sek. je Seite','15 Sek.','Blick nach vorne, Fuß aktiv stabilisieren.'],['Knie-vor-Zehen Mobilisation','10–12 je Seite','15 Sek.','Ferse bleibt am Boden.'],['Fersenheben einbeinig','10–12 je Seite','20 Sek.','Gerade nach oben arbeiten, nicht ausweichen.'],['Balance Reach','6–8 je Richtung','20 Sek.','Standbein stabil, freien Fuß kontrolliert ausstrecken.']]],

'huefte-becken':['HÜFTE & BECKEN','Gesäß • Hüftstabilität • Kontrolle','12–15 Min.',[['Glute Bridge','12–15 Wdh.','15 Sek.','Gesäß fest, Becken kontrolliert heben.'],['Clamshell','12–15 je Seite','20 Sek.','Becken bleibt übereinander, Knie öffnen.'],['Seitliches Beinheben','12 je Seite','20 Sek.','Fuß neutral, nicht nach außen drehen.'],['Hip Hinge','12–15 Wdh.','20 Sek.','Hüfte nach hinten, Rücken neutral.'],['Ausfallschritt rückwärts','8–10 je Seite','20 Sek.','Becken stabil, kontrolliert absenken.'],['90/90 Hüftwechsel','8–10 Wdh.','15 Sek.','Langsam von Seite zu Seite wechseln.']]],
'ganzkoerper-stabi':['GANZKÖRPER-STABI','Core • Gelenke • Körperkontrolle','15–18 Min.',[['Kniebeuge','12–15 Wdh.','20 Sek.','Rumpf stabil, Knie folgen den Füßen.'],['Plank','30–40 Sek.','20 Sek.','Körper bildet eine Linie.'],['Ausfallschritt','8–10 je Seite','20 Sek.','Kontrolliert tief und wieder hoch.'],['Bird Dog','10 je Seite','15 Sek.','Arm und Gegenbein strecken, Becken ruhig.'],['Seitstütz','20–30 Sek. je Seite','20 Sek.','Hüfte hoch, Schulter über Ellbogen.'],['Single-Leg Balance Reach','6–8 je Seite','25 Sek.','Standbein stabil, langsam Reichbewegungen ausführen.']]],

'athletic-core':['ATHLETIC CORE','Sportlicher Core • Kontrolle','15 Min.',[['Dead Bug','10–12 je Seite','15 Sek.','Rücken bleibt am Boden.'],['Seitplank mit Rotation','8–10 je Seite','20 Sek.','Hüfte stabil, Oberkörper kontrolliert drehen.'],['Bear Hold','20–30 Sek.','20 Sek.','Knie knapp über dem Boden, Rücken neutral.'],['Bird Dog','10–12 je Seite','15 Sek.','START: Vierfüßlerstand, beide Hände und Knie am Boden. END: gegenüberliegenden Arm und Bein vollständig strecken.'],['Plank Shoulder Tap','10–12 je Seite','20 Sek.','Becken möglichst ruhig halten.'],['Hollow Hold','20–30 Sek.','25 Sek.','Lendenwirbelsäule am Boden, Spannung halten.']]],
'hiit-power':['HIIT POWER','Kurz • Intensiv • Ganzkörper','12–16 Min.',[['Jumping Jacks','30 Sek.','20 Sek.','Rhythmisch und locker landen.'],['Squat to Reach','30 Sek.','20 Sek.','Tief beugen, dynamisch aufrichten.'],['Mountain Climbers','30 Sek.','20 Sek.','Rumpf stabil, Knie zügig vorführen.'],['Skater Steps','30 Sek.','20 Sek.','Seitlich dynamisch, Knie stabil.'],['Push-up','30 Sek.','20 Sek.','Saubere Linie; bei Bedarf Knievariante.'],['High Knees','30 Sek.','60 Sek.','Aktive Arme, kontrolliert schnell.']]],
